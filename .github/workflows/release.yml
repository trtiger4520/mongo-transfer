name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt pyinstaller==6.22.3

      - run: python test_tools.py

      - name: Build zip (onedir)
        run: |
          pyinstaller --noconfirm --windowed --name MongoTransfer app.py
          Compress-Archive -Path dist\MongoTransfer -DestinationPath "MongoTransfer-$env:GITHUB_REF_NAME-win64.zip"

      - name: Build exe (onefile)
        run: |
          pyinstaller --noconfirm --windowed --onefile --name MongoTransfer --distpath onefile app.py
          Move-Item onefile\MongoTransfer.exe "MongoTransfer-$env:GITHUB_REF_NAME.exe"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --generate-notes "MongoTransfer-$env:GITHUB_REF_NAME.exe" "MongoTransfer-$env:GITHUB_REF_NAME-win64.zip"
